<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IEEE ComSoc VIT Vellore — Landing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-black:#000000;
    --sq-blue:#2f5fe0;
    --sq-blue-2:#1b3fb8;
    --twinkle-blue:#8ecbff;
    --twinkle-blue-2:#5aa8f5;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    height:100%;
    background:var(--bg-black);
  }

  .page{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
  }

  /* ============================================
     REUSABLE COMPONENT: .stars-bg  (from background.html, untouched)
     Drop this div (plus the CSS below and the
     init script at the bottom) as the first child
     of any relatively-positioned section. Real page
     content goes after it with z-index:1+. No text
     lives in this layer -- pure animated background.
     ============================================ */

  .stars-bg{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:var(--bg-black);
    z-index:0;
  }

  /* ---------- base tiled star layers (depth + ambient density) ---------- */
  .stars-bg .layer{
    position:absolute;
    inset:-10%;
    background-repeat:repeat;
    will-change:transform, opacity;
  }

  .stars-bg .layer.tiny{
    background-image:
      radial-gradient(1px 1px at 5% 10%, #fff, transparent 100%),
      radial-gradient(1px 1px at 15% 45%, #fff, transparent 100%),
      radial-gradient(1px 1px at 25% 80%, #fff, transparent 100%),
      radial-gradient(1px 1px at 35% 25%, #fff, transparent 100%),
      radial-gradient(1px 1px at 45% 60%, #fff, transparent 100%),
      radial-gradient(1px 1px at 55% 15%, #fff, transparent 100%),
      radial-gradient(1px 1px at 65% 90%, #fff, transparent 100%),
      radial-gradient(1px 1px at 75% 35%, #fff, transparent 100%),
      radial-gradient(1px 1px at 85% 70%, #fff, transparent 100%),
      radial-gradient(1px 1px at 95% 20%, #fff, transparent 100%),
      radial-gradient(1px 1px at 10% 95%, #fff, transparent 100%),
      radial-gradient(1px 1px at 90% 50%, #fff, transparent 100%);
    background-size:220px 220px;
    animation:drift-wander-1 95s ease-in-out infinite, twinkle-flicker-a 3.1s ease-in-out infinite;
    opacity:.75;
  }

  .stars-bg .layer.small{
    background-image:
      radial-gradient(1.3px 1.3px at 8% 25%, #fff, transparent 100%),
      radial-gradient(1.3px 1.3px at 22% 60%, #fff, transparent 100%),
      radial-gradient(1.3px 1.3px at 38% 10%, #fff, transparent 100%),
      radial-gradient(1.3px 1.3px at 52% 75%, #fff, transparent 100%),
      radial-gradient(1.3px 1.3px at 66% 40%, #fff, transparent 100%),
      radial-gradient(1.3px 1.3px at 78% 85%, #fff, transparent 100%),
      radial-gradient(1.3px 1.3px at 88% 15%, #fff, transparent 100%),
      radial-gradient(1.3px 1.3px at 95% 55%, #fff, transparent 100%),
      radial-gradient(1.3px 1.3px at 15% 90%, #fff, transparent 100%);
    background-size:300px 300px;
    animation:drift-wander-2 78s ease-in-out infinite, twinkle-flicker-b 2.4s ease-in-out infinite;
    opacity:.8;
  }

  .stars-bg .layer.medium{
    background-image:
      radial-gradient(1.8px 1.8px at 12% 30%, #fff, transparent 100%),
      radial-gradient(1.8px 1.8px at 30% 70%, #fff, transparent 100%),
      radial-gradient(1.8px 1.8px at 50% 20%, #fff, transparent 100%),
      radial-gradient(1.8px 1.8px at 70% 55%, #fff, transparent 100%),
      radial-gradient(1.8px 1.8px at 88% 80%, #fff, transparent 100%),
      radial-gradient(1.8px 1.8px at 95% 35%, #fff, transparent 100%);
    background-size:420px 420px;
    animation:drift-wander-3 64s ease-in-out infinite, twinkle-flicker-c 1.9s ease-in-out infinite;
    opacity:.88;
  }

  .stars-bg .layer.large{
    background-image:
      radial-gradient(2.4px 2.4px at 18% 40%, #fff, transparent 100%),
      radial-gradient(2.6px 2.6px at 48% 22%, #fff, transparent 100%),
      radial-gradient(2.4px 2.4px at 72% 65%, #fff, transparent 100%),
      radial-gradient(2.8px 2.8px at 90% 15%, #fff, transparent 100%);
    background-size:560px 560px;
    animation:drift-wander-4 48s ease-in-out infinite, twinkle-flicker-d 1.5s ease-in-out infinite;
    opacity:.95;
    filter:drop-shadow(0 0 3px rgba(255,255,255,0.7));
  }

  @keyframes drift-wander-1{
    0%{ transform:translate3d(0,0,0); }
    22%{ transform:translate3d(-60px,40px,0); }
    50%{ transform:translate3d(-150px,-90px,0); }
    74%{ transform:translate3d(-90px,-160px,0); }
    100%{ transform:translate3d(0,0,0); }
  }
  @keyframes drift-wander-2{
    0%{ transform:translate3d(0,0,0); }
    30%{ transform:translate3d(90px,-50px,0); }
    55%{ transform:translate3d(180px,30px,0); }
    80%{ transform:translate3d(70px,140px,0); }
    100%{ transform:translate3d(0,0,0); }
  }
  @keyframes drift-wander-3{
    0%{ transform:translate3d(0,0,0); }
    28%{ transform:translate3d(-110px,-60px,0); }
    60%{ transform:translate3d(60px,-130px,0); }
    82%{ transform:translate3d(120px,50px,0); }
    100%{ transform:translate3d(0,0,0); }
  }
  @keyframes drift-wander-4{
    0%{ transform:translate3d(0,0,0); }
    35%{ transform:translate3d(80px,90px,0); }
    65%{ transform:translate3d(-70px,120px,0); }
    88%{ transform:translate3d(-130px,20px,0); }
    100%{ transform:translate3d(0,0,0); }
  }

  @keyframes twinkle-flicker-a{ 0%{opacity:.3;} 18%{opacity:.9;} 34%{opacity:.4;} 58%{opacity:1;} 77%{opacity:.35;} 100%{opacity:.3;} }
  @keyframes twinkle-flicker-b{ 0%{opacity:.25;} 15%{opacity:.8;} 40%{opacity:.3;} 62%{opacity:1;} 85%{opacity:.4;} 100%{opacity:.25;} }
  @keyframes twinkle-flicker-c{ 0%{opacity:.35;} 20%{opacity:1;} 45%{opacity:.3;} 68%{opacity:.9;} 90%{opacity:.4;} 100%{opacity:.35;} }
  @keyframes twinkle-flicker-d{ 0%{opacity:.4;} 12%{opacity:1;} 38%{opacity:.35;} 55%{opacity:.95;} 80%{opacity:.3;} 100%{opacity:.4;} }

  .stars-bg .pin-star{
    position:absolute;
    border-radius:50%;
    will-change:transform, opacity;
  }

  @keyframes pin-flicker{
    0%{ opacity:.1; transform:translate3d(0,0,0) scale(.6); }
    14%{ opacity:1; transform:translate3d(calc(var(--dx,6px) * .3), calc(var(--dy,6px) * -.4), 0) scale(1.3); }
    29%{ opacity:.2; transform:translate3d(calc(var(--dx,6px) * .1), calc(var(--dy,6px) * .2), 0) scale(.7); }
    47%{ opacity:.95; transform:translate3d(calc(var(--dx,6px) * .6), calc(var(--dy,6px) * .5), 0) scale(1.2); }
    63%{ opacity:.15; transform:translate3d(calc(var(--dx,6px) * .4), calc(var(--dy,6px) * -.2), 0) scale(.8); }
    81%{ opacity:1; transform:translate3d(calc(var(--dx,6px) * .8), calc(var(--dy,6px) * .7), 0) scale(1.4); }
    100%{ opacity:.1; transform:translate3d(0,0,0) scale(.6); }
  }

  .stars-bg .sparkle{
    position:absolute;
    animation:sparkle-pulse 4.2s ease-in-out infinite;
    will-change:transform, opacity;
  }
  .stars-bg .sparkle svg{ display:block; }
  @keyframes sparkle-pulse{
    0%{ opacity:0; transform:scale(.4) rotate(-8deg); }
    35%{ opacity:1; transform:scale(1.05) rotate(14deg); }
    55%{ opacity:.5; transform:scale(.8) rotate(6deg); }
    100%{ opacity:0; transform:scale(.4) rotate(-8deg); }
  }

  .stars-bg .glow-ring{
    position:absolute;
    border-radius:50%;
    border:3px solid var(--twinkle-blue);
    box-shadow:0 0 14px 2px rgba(94,168,245,0.7), inset 0 0 8px rgba(142,203,255,0.6);
    animation:ring-pulse 3.6s ease-in-out infinite;
  }
  @keyframes ring-pulse{
    0%,100%{ opacity:.5; transform:scale(.92); }
    50%{ opacity:1; transform:scale(1.08); }
  }

  .stars-bg .sq{
    position:absolute;
    will-change:transform;
  }
  .stars-bg .sq.blur{ filter:blur(14px); }
  .stars-bg .sq.solid-blue{
    background:linear-gradient(145deg, var(--sq-blue), var(--sq-blue-2));
    box-shadow:0 0 30px 4px rgba(47,95,224,0.55);
    border-radius:4px;
  }
  .stars-bg .sq.solid-white{
    background:rgba(255,255,255,0.95);
    border-radius:3px;
  }

  @keyframes float-wander-1{
    0%{ transform:translate(0,0) rotate(var(--rot,0deg)); }
    30%{ transform:translate(10px,-16px) rotate(var(--rot,0deg)); }
    58%{ transform:translate(-8px,-26px) rotate(var(--rot,0deg)); }
    82%{ transform:translate(-14px,-6px) rotate(var(--rot,0deg)); }
    100%{ transform:translate(0,0) rotate(var(--rot,0deg)); }
  }
  @keyframes float-wander-2{
    0%{ transform:translate(0,0) rotate(var(--rot,0deg)); }
    25%{ transform:translate(-14px,-10px) rotate(var(--rot,0deg)); }
    55%{ transform:translate(6px,-22px) rotate(var(--rot,0deg)); }
    85%{ transform:translate(16px,-4px) rotate(var(--rot,0deg)); }
    100%{ transform:translate(0,0) rotate(var(--rot,0deg)); }
  }
  @keyframes float-wander-3{
    0%{ transform:translate(0,0) rotate(var(--rot,0deg)); }
    33%{ transform:translate(12px,14px) rotate(var(--rot,0deg)); }
    60%{ transform:translate(-10px,20px) rotate(var(--rot,0deg)); }
    88%{ transform:translate(-16px,4px) rotate(var(--rot,0deg)); }
    100%{ transform:translate(0,0) rotate(var(--rot,0deg)); }
  }
  @keyframes float-wander-4{
    0%{ transform:translate(0,0) rotate(var(--rot,0deg)); }
    20%{ transform:translate(-8px,12px) rotate(var(--rot,0deg)); }
    50%{ transform:translate(-18px,-8px) rotate(var(--rot,0deg)); }
    78%{ transform:translate(4px,-18px) rotate(var(--rot,0deg)); }
    100%{ transform:translate(0,0) rotate(var(--rot,0deg)); }
  }

  .stars-bg .checker{
    position:absolute;
    display:grid;
    grid-template-columns:repeat(3, 18px);
    grid-template-rows:repeat(3, 18px);
  }
  .stars-bg .checker div{ width:18px; height:18px; }
  .stars-bg .checker div:nth-child(odd){ background:rgba(255,255,255,0.9); }
  .stars-bg .checker div:nth-child(even){ background:transparent; }

  .stars-bg .stripes{
    position:absolute;
    display:flex;
    gap:4px;
  }
  .stars-bg .stripes span{ width:4px; height:70px; border-radius:2px; }
  .stars-bg .stripes.set-a span:nth-child(1){ background:#1b3fb8; }
  .stars-bg .stripes.set-a span:nth-child(2){ background:#2f5fe0; }
  .stars-bg .stripes.set-a span:nth-child(3){ background:#6fa8ec; }
  .stars-bg .stripes.set-a span:nth-child(4){ background:#a8d4ff; }
  .stars-bg .stripes.set-a span:nth-child(5){ background:#e8f4ff; }
  .stars-bg .stripes.set-a span:nth-child(6){ background:#ffffff; }

  /* ============================================
     REUSABLE COMPONENT: rocket launch → orbit → dock
     Sits ABOVE .stars-bg (z-index:2). Your real page
     content (nav, logo, comsoc box) all lives above this
     too, so the rocket/trail pass BEHIND text but IN FRONT
     of the star field.
     ============================================ */
  .rocket-scene{
    position:absolute;
    inset:0;
    z-index:2;
    pointer-events:none;
    overflow:visible;
  }

  .rocket-scene .trail-path{
    fill:none;
    stroke:url(#trailGradient);
    stroke-width:3;
    stroke-linecap:round;
    filter:drop-shadow(0 0 6px rgba(94,168,245,0.9));
  }

  .rocket-scene .rocket{
    position:absolute;
    top:0; left:0;
    filter:drop-shadow(0 0 8px rgba(94,168,245,.9)) drop-shadow(0 0 16px rgba(47,95,224,.6));
    opacity:0;
  }

  /* small permanent glow left behind once the rocket docks into the nav */
  .rocket-scene.docked #navDock{
    opacity:1;
  }
  #navDock{
    position:absolute;
    top:5.5%; left:91.5%;
    width:10px; height:10px;
    border-radius:50%;
    background:#8ecbff;
    box-shadow:0 0 12px 4px rgba(94,168,245,.9);
    animation:ring-pulse 2s ease-in-out infinite;
    opacity:0;
    transition:opacity .4s ease;
  }

  /* ============================================
     PAGE CONTENT — matches the reference image.
     z-index:3, sits above the rocket scene.
     Put your real <nav> above/around .content-layer;
     it is intentionally NOT included here.
     ============================================ */
  .content-layer{
    position:absolute;
    inset:0;
    z-index:3;
    pointer-events:none;
  }

  .ieee-logo{
    position:absolute;
    top:22%;
    left:3.5%;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .ieee-logo .ieee-star{
    width:42px; height:42px;
    filter:drop-shadow(0 0 10px rgba(94,168,245,.8));
  }
  .ieee-logo .ieee-text{
    font-family:Georgia, 'Times New Roman', serif;
    font-weight:700;
    font-style:italic;
    font-size:clamp(48px, 9vw, 108px);
    letter-spacing:.01em;
    line-height:1;
    background:linear-gradient(90deg, #2f5fe0 0%, #6fa8ec 45%, #dfeeff 75%, #9fb3c8 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .comsoc-panel{
    position:absolute;
    top:36%;
    left:34%;
    width:50%;
    height:24%;
    border:1px solid rgba(142,203,255,0.35);
    border-radius:14px;
    background:radial-gradient(ellipse at 30% 30%, rgba(47,95,224,0.28), rgba(0,0,0,0) 70%),
               linear-gradient(135deg, rgba(47,95,224,0.14), rgba(0,0,0,0.05));
    backdrop-filter:blur(2px);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .comsoc-panel .comsoc-text{
    font-family:'Press Start 2P', 'Courier New', monospace;
    font-size:clamp(26px, 5.2vw, 62px);
    letter-spacing:.06em;
    color:#ffffff;
    text-shadow:0 0 14px rgba(142,203,255,.85), 0 0 28px rgba(47,95,224,.55);
  }

  .vit-chapter-row{
    position:absolute;
    top:79%;
    left:2%;
    display:flex;
    align-items:center;
    gap:22px;
  }
  .vit-chapter-row .vit-icon{
    display:flex;
    gap:3px;
    height:50px;
    align-items:flex-end;
  }
  .vit-chapter-row .vit-icon span{
    width:4px;
    border-radius:2px;
    background:linear-gradient(180deg, #dfeeff, #2f5fe0);
  }
  .vit-chapter-row .vit-icon span:nth-child(1){ height:35%; }
  .vit-chapter-row .vit-icon span:nth-child(2){ height:55%; }
  .vit-chapter-row .vit-icon span:nth-child(3){ height:75%; }
  .vit-chapter-row .vit-icon span:nth-child(4){ height:95%; }
  .vit-chapter-row .vit-icon span:nth-child(5){ height:65%; }
  .vit-chapter-row .vit-icon span:nth-child(6){ height:45%; }

  .vit-chapter-row .vit-text{
    font-family:'Press Start 2P', 'Courier New', monospace;
    font-size:clamp(16px, 2.6vw, 30px);
    letter-spacing:.05em;
    color:#ffffff;
    text-shadow:0 0 10px rgba(142,203,255,.6);
  }

  .bottom-bar{
    position:absolute;
    top:89.5%;
    left:11.5%;
    width:30%;
    max-width:340px;
    height:34px;
    display:flex;
    align-items:stretch;
  }
  .bottom-bar .bar-solid{
    width:26%;
    background:#2f5fe0;
    border-radius:4px 0 0 4px;
    box-shadow:0 0 20px 2px rgba(47,95,224,.5);
  }
  .bottom-bar .bar-stripes{
    flex:1;
    background:repeating-linear-gradient(
      180deg,
      #dfeeff 0px, #dfeeff 2px,
      transparent 2px, transparent 5px
    );
    background-color:rgba(111,168,236,0.25);
    border-radius:0 4px 4px 0;
  }

  /* the cyan text that the rocket's trail reveals as it climbs */
  .reveal-text{
    position:absolute;
    top:9%;
    left:50%;
    transform:translateX(-50%);
    font-family:'Press Start 2P', 'Courier New', monospace;
    font-weight:400;
    letter-spacing:.1em;
    font-size:clamp(12px, 1.8vw, 20px);
    color:#eaf6ff;
    text-shadow:0 0 10px rgba(94,168,245,.9), 0 0 22px rgba(47,95,224,.6);
    white-space:nowrap;
    clip-path:inset(0 100% 0 0);
  }

  /* invisible anchor: where the rocket docks. Sits at the right edge,
     roughly where a nav rail's last icon/button would be. Move this
     to sit exactly on top of your real nav element once it's added. */
  #navRailAnchor{
    position:absolute;
    top:5.5%;
    left:91.5%;
    width:1px;
    height:1px;
  }
</style>
</head>
<body>

<div class="page">

  <!-- ===== reusable background block ===== -->
  <div class="stars-bg" id="starsBg">
    <div class="layer tiny"></div>
    <div class="layer small"></div>
    <div class="layer medium"></div>
    <div class="layer large"></div>

    <!-- foreground pin-stars + sparkles are injected here by JS at runtime -->

    <div class="glow-ring" style="top:31%; left:44%; width:22px; height:22px;"></div>

    <div class="sq solid-white blur" style="top:6%; left:82%; width:60px; height:60px; --rot:0deg; animation:float-wander-1 12s ease-in-out infinite;"></div>
    <div class="sq solid-white blur" style="top:12%; left:76%; width:44px; height:44px; --rot:0deg; animation:float-wander-3 9.5s ease-in-out infinite; animation-delay:.6s;"></div>
    <div class="sq solid-white blur" style="top:16%; left:86%; width:36px; height:36px; --rot:0deg; animation:float-wander-2 10.5s ease-in-out infinite; animation-delay:1.3s;"></div>

    <div class="sq solid-white blur" style="top:9%; left:24%; width:56px; height:56px; --rot:28deg; transform:rotate(28deg); animation:float-wander-4 13s ease-in-out infinite; animation-delay:.3s;"></div>

    <div class="sq solid-white blur" style="top:60%; left:70%; width:50px; height:50px; animation:float-wander-2 11s ease-in-out infinite; animation-delay:.9s;"></div>
    <div class="sq solid-white blur" style="top:65%; left:60%; width:34px; height:34px; animation:float-wander-1 8.5s ease-in-out infinite; animation-delay:1.7s;"></div>
    <div class="sq solid-white blur" style="top:82%; left:42%; width:36px; height:36px; animation:float-wander-3 10s ease-in-out infinite; animation-delay:.4s;"></div>
    <div class="sq solid-white blur" style="top:83%; left:9%; width:38px; height:38px; animation:float-wander-4 9s ease-in-out infinite; animation-delay:1.5s;"></div>

    <div class="sq solid-blue" style="top:75%; left:48%; width:34px; height:34px; animation:float-wander-2 8s ease-in-out infinite; animation-delay:.2s;"></div>
    <div class="sq solid-blue" style="top:78%; left:14%; width:60px; height:44px; animation:float-wander-1 10.5s ease-in-out infinite; animation-delay:1.1s;"></div>

    <div class="checker" style="top:80%; left:83%; animation:float-wander-3 12.5s ease-in-out infinite; animation-delay:.8s;">
      <div></div><div></div><div></div>
      <div></div><div></div><div></div>
      <div></div><div></div><div></div>
    </div>

    <div class="stripes set-a" style="top:73%; left:3%; animation:float-wander-4 11.5s ease-in-out infinite; animation-delay:.2s;">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="stripes set-a" style="top:92%; left:44%; transform:scale(.5); animation:float-wander-2 9.5s ease-in-out infinite; animation-delay:1.4s;">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>

  <!-- ===== rocket launch / orbit / dock ===== -->
  <div class="rocket-scene" id="rocketScene">
    <svg width="100%" height="100%" style="position:absolute; inset:0; overflow:visible;">
      <defs>
        <linearGradient id="trailGradient" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#5aa8f5" stop-opacity="0"/>
          <stop offset="100%" stop-color="#8ecbff" stop-opacity="0.95"/>
        </linearGradient>
      </defs>
      <path id="rocketTrail" class="trail-path" d=""></path>
    </svg>

    <div class="reveal-text" id="revealText">IEEE COMSOC VIT VELLORE</div>

    <svg class="rocket" id="rocket" width="34" height="34" viewBox="0 0 34 34">
      <g id="rocketInner" transform="translate(17,17) rotate(0)">
        <path d="M0,-16 C6,-6 6,6 3,14 L-3,14 C-6,6 -6,-6 0,-16 Z" fill="#eaf6ff"/>
        <path d="M-3,10 L-11,16 L-4,12 Z" fill="#5aa8f5"/>
        <path d="M3,10 L11,16 L4,12 Z" fill="#5aa8f5"/>
        <circle cx="0" cy="-4" r="3" fill="#2f5fe0"/>
      </g>
    </svg>

    <div id="navDock"></div>
  </div>

  <!-- ===== page content (matches the reference image) =====
       Your real <nav> (HOME / ABOUT / ACHIEVEMENTS / TEAM / GALLERY / CONTACT US)
       goes ABOVE this block, inside .page, with z-index:4+.
       #navRailAnchor marks where the rocket should dock — move it to sit
       on your actual nav element (e.g. the last nav link / a logo icon). -->
  <div class="content-layer">
    <div id="navRailAnchor"></div>

    <div class="ieee-logo" id="logoAnchor">
      <svg class="ieee-star" viewBox="0 0 100 100">
        <path d="M50 2 L61 35 L96 35 L67 55 L78 90 L50 70 L22 90 L33 55 L4 35 L39 35 Z"
              fill="#5aa8f5"/>
      </svg>
      <span class="ieee-text">IEEE</span>
    </div>

    <div class="comsoc-panel" id="comsocPanel">

<script>
(function(){
  var container = document.getElementById('starsBg');

  var STAR_COUNT = 90;
  for (var i = 0; i < STAR_COUNT; i++){
    var star = document.createElement('div');
    star.className = 'pin-star';

    var top = Math.random() * 100;
    var left = Math.random() * 100;
    var size = (Math.random() * 2.2 + 1).toFixed(2);
    var duration = (Math.random() * 3 + 1.8).toFixed(2);
    var delay = (Math.random() * 5).toFixed(2);
    var dx = (Math.random() * 14 - 7).toFixed(1) + 'px';
    var dy = (Math.random() * 14 - 7).toFixed(1) + 'px';

    var isBlue = Math.random() < 0.25;
    var color = isBlue ? 'var(--twinkle-blue)' : '#ffffff';
    var glow = isBlue
      ? '0 0 7px 2px rgba(94,168,245,0.85)'
      : '0 0 6px 1px rgba(255,255,255,0.9)';

    star.style.top = top + '%';
    star.style.left = left + '%';
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.background = color;
    star.style.boxShadow = glow;
    star.style.setProperty('--dx', dx);
    star.style.setProperty('--dy', dy);
    star.style.animation = 'pin-flicker ' + duration + 's ease-in-out infinite';
    star.style.animationDelay = delay + 's';

    container.appendChild(star);
  }

  var sparkleSpots = [
    { top: 30, left: 88, size: 34, color: '#8ecbff', delay: 0 },
    { top: 33, left: 91, size: 18, color: '#ffffff', delay: 1.4 },
    { top: 8,  left: 60, size: 16, color: '#ffffff', delay: 2.1 },
    { top: 46, left: 6,  size: 14, color: '#8ecbff', delay: 0.7 },
    { top: 68, left: 92, size: 15, color: '#ffffff', delay: 2.6 }
  ];
  sparkleSpots.forEach(function(s){
    var wrap = document.createElement('div');
    wrap.className = 'sparkle';
    wrap.style.top = s.top + '%';
    wrap.style.left = s.left + '%';
    wrap.style.animationDuration = (3.5 + Math.random() * 2).toFixed(2) + 's';
    wrap.style.animationDelay = s.delay + 's';
    wrap.innerHTML = '<svg width="' + s.size + '" height="' + s.size + '" viewBox="0 0 24 24">' +
      '<path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" fill="' + s.color + '"/></svg>';
    container.appendChild(wrap);
  });
})();
</script>

<script>
(function(){
  var page   = document.querySelector('.page');
  var scene  = document.getElementById('rocketScene');
  var rocket = document.getElementById('rocket');
  var inner  = document.getElementById('rocketInner');
  var trail  = document.getElementById('rocketTrail');
  var text   = document.getElementById('revealText');
  var logoEl = document.getElementById('logoAnchor');
  var dockEl = document.getElementById('navRailAnchor');

  // ---- helpers ----
  function pageRect(){ return page.getBoundingClientRect(); }

  // percentage point relative to the .page box
  function pt(xPct, yPct){
    var r = pageRect();
    return { x: r.width * xPct / 100, y: r.height * yPct / 100 };
  }

  // center of a real DOM element, converted into .page-local coordinates
  function centerOf(el, fallbackXPct, fallbackYPct){
    if (!el) return pt(fallbackXPct, fallbackYPct);
    var r = el.getBoundingClientRect();
    var p = pageRect();
    return { x: (r.left + r.width / 2) - p.left, y: (r.top + r.height / 2) - p.top };
  }

  function bez(p0, p1, p2, t){
    var mt = 1 - t;
    return {
      x: mt*mt*p0.x + 2*mt*t*p1.x + t*t*p2.x,
      y: mt*mt*p0.y + 2*mt*t*p1.y + t*t*p2.y
    };
  }

  function place(pos, angleDeg){
    rocket.style.transform = 'translate(' + (pos.x - 17) + 'px,' + (pos.y - 17) + 'px)';
    inner.setAttribute('transform', 'translate(17,17) rotate(' + angleDeg + ')');
  }

  // keep the trail from growing forever / staying dense forever:
  // drop the oldest points once we have plenty, so the tail behind
  // the rocket softly thins out instead of leaving one giant static line.
  var MAX_TRAIL_POINTS = 220;
  var trailPts = [];
  function pushTrail(pos){
    trailPts.push(pos.x.toFixed(1) + ',' + pos.y.toFixed(1));
    if (trailPts.length > MAX_TRAIL_POINTS) trailPts.shift();
    trail.setAttribute('d', 'M' + trailPts.join(' L'));
  }

  // ---- key layout points ----
  // Orbit target = the real IEEE + COMSOC lockup, read live from the DOM
  // so it always matches wherever that block actually sits on screen.
  var LOGO_CENTER  = centerOf(logoEl, 27, 33);
  // Dock target = #navRailAnchor. Move that element in the HTML to sit
  // exactly on your real navbar once it's added back in.
  var NAV_DOCK      = centerOf(dockEl, 91.5, 5.5);
  var ORBIT_RADIUS  = Math.min(pageRect().width, pageRect().height) * 0.14;

  var START       = pt(50, 108);   // launches from bottom-center, off-screen
  var LAUNCH_CTRL = pt(47, 55);
  var LAUNCH_END  = pt(50, 16);    // arrives just above the logo/text band

  // ---- timings: slowed down considerably ----
  var LAUNCH_MS = 6000;
  var ORBIT_MS  = 5500;
  var DOCK_MS   = 3200;

  function easeInOutCubic(t){
    return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
  }

  function launch(t0){
    requestAnimationFrame(function loop(now){
      var raw = Math.min(1, (now - t0) / LAUNCH_MS);
      var t = easeInOutCubic(raw);
      var pos  = bez(START, LAUNCH_CTRL, LAUNCH_END, t);
      var next = bez(START, LAUNCH_CTRL, LAUNCH_END, Math.min(1, t + 0.005));
      var angle = Math.atan2(next.y - pos.y, next.x - pos.x) * 180 / Math.PI + 90;

      rocket.style.opacity = 1;
      place(pos, angle);
      pushTrail(pos);
      text.style.clipPath = 'inset(0 ' + (100 - raw * 100) + '% 0 0)';

      if (raw < 1) requestAnimationFrame(loop);
      else orbit(performance.now(), pos);
    });
  }

  function orbit(t0, from){
    var startAngle = Math.atan2(from.y - LOGO_CENTER.y, from.x - LOGO_CENTER.x);
    requestAnimationFrame(function loop(now){
      var raw = Math.min(1, (now - t0) / ORBIT_MS);
      var angle = startAngle + raw * Math.PI * 2; // exactly one full orbit
      var pos = {
        x: LOGO_CENTER.x + ORBIT_RADIUS * Math.cos(angle),
        y: LOGO_CENTER.y + ORBIT_RADIUS * Math.sin(angle) * 0.55 // slight ellipse so it clears the panel
      };
      place(pos, angle * 180 / Math.PI + 90);
      pushTrail(pos);
      if (raw < 1) requestAnimationFrame(loop);
      else dock(performance.now(), pos);
    });
  }

  function dock(t0, from){
    var ctrl = { x: (from.x + NAV_DOCK.x) / 2, y: Math.min(from.y, NAV_DOCK.y) - 40 };
    requestAnimationFrame(function loop(now){
      var raw = Math.min(1, (now - t0) / DOCK_MS);
      var t = easeInOutCubic(raw);
      var pos  = bez(from, ctrl, NAV_DOCK, t);
      var next = bez(from, ctrl, NAV_DOCK, Math.min(1, t + 0.01));
      var angle = Math.atan2(next.y - pos.y, next.x - pos.x) * 180 / Math.PI + 90;
      place(pos, angle);
      pushTrail(pos);
      rocket.style.opacity = 1 - raw;
      // fade the whole trail out as the rocket comes in to dock
      trail.style.opacity = 1 - raw;
      if (raw < 1) requestAnimationFrame(loop);
      else scene.classList.add('docked');
    });
  }

  // small delay so the star field is visibly settled before launch
  setTimeout(function(){ requestAnimationFrame(launch); }, 500);
})();
</script>
