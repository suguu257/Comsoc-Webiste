<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meet Our Team</title>

<!-- Retro Pixel Font -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />

<style>
  :root{
    --bg-black:#000000;
    --sq-blue:#2f5fe0;
    --sq-blue-2:#1b3fb8;
    --twinkle-blue:#8ecbff;
    --twinkle-blue-2:#5aa8f5;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    min-height:100%;
    background:var(--bg-black);
    font-family: 'Press Start 2P', monospace;
  }

  /* Animated Stars Background Layer */
  .stars-bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:var(--bg-black);
    z-index:0;
  }

  .stars-bg .layer{
    position:absolute;
    inset:-10%;
    background-repeat:repeat;
    will-change:transform, opacity;
  }

  .stars-bg .layer.tiny{
    background-image:
      radial-gradient(1px 1px at 5% 10%, #fff, transparent 100%),
      radial-gradient(1px 1px at 15% 45%, #fff, transparent 100%),
      radial-gradient(1px 1px at 25% 80%, #fff, transparent 100%),
      radial-gradient(1px 1px at 35% 25%, #fff, transparent 100%),
      radial-gradient(1px 1px at 45% 60%, #fff, transparent 100%),
      radial-gradient(1px 1px at 55% 15%, #fff, transparent 100%),
      radial-gradient(1px 1px at 65% 90%, #fff, transparent 100%),
      radial-gradient(1px 1px at 75% 35%, #fff, transparent 100%),
      radial-gradient(1px 1px at 85% 70%, #fff, transparent 100%),
      radial-gradient(1px 1px at 95% 20%, #fff, transparent 100%),
      radial-gradient(1px 1px at 10% 95%, #fff, transparent 100%),
      radial-gradient(1px 1px at 90% 50%, #fff, transparent 100%);
    background-size:220px 220px;
    animation:drift-wander-1 95s ease-in-out infinite, twinkle-flicker-a 3.1s ease-in-out infinite;
    opacity:.75;
  }

  .stars-bg .layer.small{
    background-image:
      radial-gradient(1.3px 1.3px at 8% 25%, #fff, transparent 100%),
      radial-gradient(1.3px 1.3px at 22% 60%, #fff, transparent 100%),
      radial-gradient(1.3px 1.3px at 38% 10%, #fff, transparent 100%),
      radial-gradient(1.3px 1.3px at 52% 75%, #fff, transparent 100%),
      radial-gradient(1.3px 1.3px at 66% 40%, #fff, transparent 100%),
      radial-gradient(1.3px 1.3px at 78% 85%, #fff, transparent 100%),
      radial-gradient(1.3px 1.3px at 88% 15%, #fff, transparent 100%),
      radial-gradient(1.3px 1.3px at 95% 55%, #fff, transparent 100%),
      radial-gradient(1.3px 1.3px at 15% 90%, #fff, transparent 100%);
    background-size:300px 300px;
    animation:drift-wander-2 78s ease-in-out infinite, twinkle-flicker-b 2.4s ease-in-out infinite;
    opacity:.8;
  }

  .stars-bg .layer.medium{
    background-image:
      radial-gradient(1.8px 1.8px at 12% 30%, #fff, transparent 100%),
      radial-gradient(1.8px 1.8px at 30% 70%, #fff, transparent 100%),
      radial-gradient(1.8px 1.8px at 50% 20%, #fff, transparent 100%),
      radial-gradient(1.8px 1.8px at 70% 55%, #fff, transparent 100%),
      radial-gradient(1.8px 1.8px at 88% 80%, #fff, transparent 100%),
      radial-gradient(1.8px 1.8px at 95% 35%, #fff, transparent 100%);
    background-size:420px 420px;
    animation:drift-wander-3 64s ease-in-out infinite, twinkle-flicker-c 1.9s ease-in-out infinite;
    opacity:.88;
  }

  .stars-bg .layer.large{
    background-image:
      radial-gradient(2.4px 2.4px at 18% 40%, #fff, transparent 100%),
      radial-gradient(2.6px 2.6px at 48% 22%, #fff, transparent 100%),
      radial-gradient(2.4px 2.4px at 72% 65%, #fff, transparent 100%),
      radial-gradient(2.8px 2.8px at 90% 15%, #fff, transparent 100%);
    background-size:560px 560px;
    animation:drift-wander-4 48s ease-in-out infinite, twinkle-flicker-d 1.5s ease-in-out infinite;
    opacity:.95;
    filter:drop-shadow(0 0 3px rgba(255,255,255,0.7));
  }

  @keyframes drift-wander-1{
    0%{ transform:translate3d(0,0,0); }
    22%{ transform:translate3d(-60px,40px,0); }
    50%{ transform:translate3d(-150px,-90px,0); }
    74%{ transform:translate3d(-90px,-160px,0); }
    100%{ transform:translate3d(0,0,0); }
  }
  @keyframes drift-wander-2{
    0%{ transform:translate3d(0,0,0); }
    30%{ transform:translate3d(90px,-50px,0); }
    55%{ transform:translate3d(180px,30px,0); }
    80%{ transform:translate3d(70px,140px,0); }
    100%{ transform:translate3d(0,0,0); }
  }
  @keyframes drift-wander-3{
    0%{ transform:translate3d(0,0,0); }
    28%{ transform:translate3d(-110px,-60px,0); }
    60%{ transform:translate3d(60px,-130px,0); }
    82%{ transform:translate3d(120px,50px,0); }
    100%{ transform:translate3d(0,0,0); }
  }
  @keyframes drift-wander-4{
    0%{ transform:translate3d(0,0,0); }
    35%{ transform:translate3d(80px,90px,0); }
    65%{ transform:translate3d(-70px,120px,0); }
    88%{ transform:translate3d(-130px,20px,0); }
    100%{ transform:translate3d(0,0,0); }
  }

  @keyframes twinkle-flicker-a{ 0%{opacity:.3;} 18%{opacity:.9;} 34%{opacity:.4;} 58%{opacity:1;} 77%{opacity:.35;} 100%{opacity:.3;} }
  @keyframes twinkle-flicker-b{ 0%{opacity:.25;} 15%{opacity:.8;} 40%{opacity:.3;} 62%{opacity:1;} 85%{opacity:.4;} 100%{opacity:.25;} }
  @keyframes twinkle-flicker-c{ 0%{opacity:.35;} 20%{opacity:1;} 45%{opacity:.3;} 68%{opacity:.9;} 90%{opacity:.4;} 100%{opacity:.35;} }
  @keyframes twinkle-flicker-d{ 0%{opacity:.4;} 12%{opacity:1;} 38%{opacity:.35;} 55%{opacity:.95;} 80%{opacity:.3;} 100%{opacity:.4;} }

  .stars-bg .pin-star{
    position:absolute;
    border-radius:50%;
    will-change:transform, opacity;
  }

  @keyframes pin-flicker{
    0%{ opacity:.1; transform:translate3d(0,0,0) scale(.6); }
    14%{ opacity:1; transform:translate3d(calc(var(--dx,6px) * .3), calc(var(--dy,6px) * -.4), 0) scale(1.3); }
    29%{ opacity:.2; transform:translate3d(calc(var(--dx,6px) * .1), calc(var(--dy,6px) * .2), 0) scale(.7); }
    47%{ opacity:.95; transform:translate3d(calc(var(--dx,6px) * .6), calc(var(--dy,6px) * .5), 0) scale(1.2); }
    63%{ opacity:.15; transform:translate3d(calc(var(--dx,6px) * .4), calc(var(--dy,6px) * -.2), 0) scale(.8); }
    81%{ opacity:1; transform:translate3d(calc(var(--dx,6px) * .8), calc(var(--dy,6px) * .7), 0) scale(1.4); }
    100%{ opacity:.1; transform:translate3d(0,0,0) scale(.6); }
  }

  .stars-bg .sparkle{
    position:absolute;
    animation:sparkle-pulse 4.2s ease-in-out infinite;
    will-change:transform, opacity;
  }
  .stars-bg .sparkle svg{ display:block; }
  @keyframes sparkle-pulse{
    0%{ opacity:0; transform:scale(.4) rotate(-8deg); }
    35%{ opacity:1; transform:scale(1.05) rotate(14deg); }
    55%{ opacity:.5; transform:scale(.8) rotate(6deg); }
    100%{ opacity:0; transform:scale(.4) rotate(-8deg); }
  }

  .stars-bg .glow-ring{
    position:absolute;
    border-radius:50%;
    border:3px solid var(--twinkle-blue);
    box-shadow:0 0 14px 2px rgba(94,168,245,0.7), inset 0 0 8px rgba(142,203,255,0.6);
    animation:ring-pulse 3.6s ease-in-out infinite;
  }
  @keyframes ring-pulse{
    0%,100%{ opacity:.5; transform:scale(.92); }
    50%{ opacity:1; transform:scale(1.08); }
  }

  .stars-bg .sq{
    position:absolute;
    will-change:transform;
  }
  .stars-bg .sq.blur{ filter:blur(14px); }
  .stars-bg .sq.solid-blue{
    background:linear-gradient(145deg, var(--sq-blue), var(--sq-blue-2));
    box-shadow:0 0 30px 4px rgba(47,95,224,0.55);
    border-radius:4px;
  }
  .stars-bg .sq.solid-white{
    background:rgba(255,255,255,0.95);
    border-radius:3px;
  }

  @keyframes float-wander-1{
    0%{ transform:translate(0,0) rotate(var(--rot,0deg)); }
    30%{ transform:translate(10px,-16px) rotate(var(--rot,0deg)); }
    58%{ transform:translate(-8px,-26px) rotate(var(--rot,0deg)); }
    82%{ transform:translate(-14px,-6px) rotate(var(--rot,0deg)); }
    100%{ transform:translate(0,0) rotate(var(--rot,0deg)); }
  }
  @keyframes float-wander-2{
    0%{ transform:translate(0,0) rotate(var(--rot,0deg)); }
    25%{ transform:translate(-14px,-10px) rotate(var(--rot,0deg)); }
    55%{ transform:translate(6px,-22px) rotate(var(--rot,0deg)); }
    85%{ transform:translate(16px,-4px) rotate(var(--rot,0deg)); }
    100%{ transform:translate(0,0) rotate(var(--rot,0deg)); }
  }
  @keyframes float-wander-3{
    0%{ transform:translate(0,0) rotate(var(--rot,0deg)); }
    33%{ transform:translate(12px,14px) rotate(var(--rot,0deg)); }
    60%{ transform:translate(-10px,20px) rotate(var(--rot,0deg)); }
    88%{ transform:translate(-16px,4px) rotate(var(--rot,0deg)); }
    100%{ transform:translate(0,0) rotate(var(--rot,0deg)); }
  }
  @keyframes float-wander-4{
    0%{ transform:translate(0,0) rotate(var(--rot,0deg)); }
    20%{ transform:translate(-8px,12px) rotate(var(--rot,0deg)); }
    50%{ transform:translate(-18px,-8px) rotate(var(--rot,0deg)); }
    78%{ transform:translate(4px,-18px) rotate(var(--rot,0deg)); }
    100%{ transform:translate(0,0) rotate(var(--rot,0deg)); }
  }

  .stars-bg .checker{
    position:absolute;
    display:grid;
    grid-template-columns:repeat(3, 18px);
    grid-template-rows:repeat(3, 18px);
  }
  .stars-bg .checker div{ width:18px; height:18px; }
  .stars-bg .checker div:nth-child(odd){ background:rgba(255,255,255,0.9); }
  .stars-bg .checker div:nth-child(even){ background:transparent; }

  .stars-bg .stripes{
    position:absolute;
    display:flex;
    gap:4px;
  }
  .stars-bg .stripes span{ width:4px; height:70px; border-radius:2px; }
  .stars-bg .stripes.set-a span:nth-child(1){ background:#1b3fb8; }
  .stars-bg .stripes.set-a span:nth-child(2){ background:#2f5fe0; }
  .stars-bg .stripes.set-a span:nth-child(3){ background:#6fa8ec; }
  .stars-bg .stripes.set-a span:nth-child(4){ background:#a8d4ff; }
  .stars-bg .stripes.set-a span:nth-child(5){ background:#e8f4ff; }
  .stars-bg .stripes.set-a span:nth-child(6){ background:#ffffff; }

  /* ============================================
     FOREGROUND CONTENT LAYOUT
     ============================================ */
  .content-layer {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Header Banner Styling */
  .banner-container {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    color: #ffffff;
    user-select: none;
    margin-bottom: 40px;
  }

  .logo-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .flare {
    position: absolute;
    top: -30px;
    left: -30px;
    width: 80px;
    height: 80px;
    background-color: #ffffff;
    filter: blur(8px);
    opacity: 0.7;
    transform: rotate(45deg);
    z-index: 2;
    pointer-events: none;
  }

  .blue-box {
    position: relative;
    width: 90px;
    height: 90px;
    background-color: #1a4b9c;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }

  .letter-m {
    color: #000000;
    font-weight: 900;
    transform: translateY(2px);
    font-size: 80px;
  }

  .text-content {
    display: flex;
    font-size: 80px;
    gap: 20px;
    color: #ffffff;
  }

  @media (max-width: 768px) {
    .banner-container {
      gap: 8px;
      margin-bottom: 24px;
    }
    .blue-box {
      width: 40px;
      height: 40px;
    }
    .flare {
      width: 35px;
      height: 35px;
      top: -10px;
      left: -10px;
    }
    .text-content {
      gap: 10px;
      font-size: 32px;
    }
    .letter-m {
      font-size: 32px;
    }
  }

  /* Interactive Team Canvas Wrapper */
  .team-interactive-wrapper {
    position: relative;
    width: 100%;
    max-width: 4000px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    border-radius: 6px;
    box-shadow: 0px 10px 40px rgba(0, 0, 0, 0.9);
    cursor: pointer;
  }

  /* Main background photo */
  .group-bg-photo {
    width: 100%;
    height: auto;
    display: block;
    object-fit: contain;
    transition: filter 0.4s ease;
    filter: brightness(0.9);
  }

  .team-interactive-wrapper.has-active .group-bg-photo {
    filter: brightness(0.25) grayscale(80%);
  }

  /* Cutout photo overlay for single active person */
  .group-color-photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
    z-index: 2;
  }

  .group-color-photo.active {
    opacity: 1;
  }

  /* Dimming gradient behind the title, like a paused Netflix video */
  .info-gradient {
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.55) 32%, rgba(0,0,0,0) 65%);
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .info-gradient.active {
    opacity: 1;
  }

  /* Overlay Info UI - fixed title card over the dimmed photo */
  .info-overlay {
    position: absolute;
    bottom: 40px;
    left: 40px;
    right: 40px;
    z-index: 5;
    pointer-events: none;
    opacity: 0;
    transform: translateY(15px);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }

  .info-overlay.active {
    opacity: 1;
    transform: translateY(0);
  }

  .role-title {
    color: var(--twinkle-blue-2);
    font-size: 1.5rem;
    margin: 0 0 10px 0;
    letter-spacing: 1px;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
  }

  .person-bio {
    color: #e5e5e5;
    font-size: 0.75rem;
    line-height: 1.6;
    margin: 0;
    text-shadow: 1px 1px 6px rgba(0,0,0,0.9);
  }

  @media (max-width: 768px) {
    .info-overlay { bottom: 20px; left: 20px; right: 20px; }
    .role-title { font-size: 1rem; }
    .person-bio { font-size: 0.6rem; }
  }
</style>
</head>

<!-- Animated Background Layer -->

  <div class="layer small"></div>

  <div class="glow-ring" style="top:31%; left:44%; width:22px; height:22px;"></div>

    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
</div>

<!-- Foreground Page Content -->
<div class="content-layer">
  
  <!-- Banner Title -->
  <div class="banner-container">
    <div class="logo-wrapper">
      <div class="flare"></div>
      <div class="blue-box">
        <span class="letter-m">M</span>
      </div>
    </div>
    <div class="text-content">
      <span>EET</span>
      <span>OUR</span>
      <span>TEAM</span>

  <!-- Team Interactive Container -->
  <div class="team-interactive-wrapper" id="teamContainer">

      <p class="person-bio" id="bioText">Lorem ipsum dolor sit amet consectetur, adipisicing elit.</p>

  </div>

</div>

const personDataMap = {

// --- 2. OFF-SCREEN MASK CANVAS SETUP ---
const maskImage = new Image();
maskImage.crossOrigin = "Anonymous";

// Fallback embedded SVG mask image data
const svgMask = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="562">
  <rect x="450" y="172" width="102" height="318" fill="rgb(255,0,0)"/> 
  <rect x="3" y="188" width="160" height="350" fill="rgb(0,255,0)"/> 
  <rect x="591" y="192" width="268" height="363" fill="rgb(0,0,255)"/> 
  <rect x="271" y="174" width="129" height="386" fill="rgb(255,255,0)"/>

  <rect x="832" y="159" width="156" height="396" fill="rgb(0,255,255)"/>

</svg>`; 

maskImage.src = svgMask; // Replace with 'YOUR_COLOR_MASK.png' when using a external file

const offscreenCanvas = document.createElement('canvas');
const ctx = offscreenCanvas.getContext('2d', { willReadFrequently: true });
let isMaskLoaded = false;

maskImage.onload = () => {
  offscreenCanvas.width = maskImage.naturalWidth;
  offscreenCanvas.height = maskImage.naturalHeight;
  ctx.drawImage(maskImage, 0, 0);
  isMaskLoaded = true;
};

// --- 3. HOVER DETECTION LOGIC ---
const container = document.getElementById('teamContainer');
const colorPhoto = document.getElementById('colorPhoto');
const overlay = document.getElementById('overlayText');
const infoGradient = document.getElementById('infoGradient');
const roleText = document.getElementById('roleText');
const bioText = document.getElementById('bioText');

let currentActiveColor = null;

container.addEventListener('mousemove', (e) => {
  if (!isMaskLoaded) return;

  const rect = container.getBoundingClientRect();
  const scaleX = offscreenCanvas.width / rect.width;
  const scaleY = offscreenCanvas.height / rect.height;

  const x = Math.floor((e.clientX - rect.left) * scaleX);
  const y = Math.floor((e.clientY - rect.top) * scaleY);

  try {
    const pixel = ctx.getImageData(x, y, 1, 1).data;
    const rgbKey = `${pixel[0]},${pixel[1]},${pixel[2]}`;

    if (personDataMap[rgbKey]) {
      if (currentActiveColor !== rgbKey) {
        currentActiveColor = rgbKey;
        const person = personDataMap[rgbKey];

        roleText.textContent = person.role;
        bioText.textContent = person.bio;
        colorPhoto.src = person.image; // Dynamically sets the transparent cutout picture

        container.classList.add('has-active');
        colorPhoto.classList.add('active');
        infoGradient.classList.add('active');
        overlay.classList.add('active');
      }
    } else {
      clearHighlight();
    }
  } catch (err) {
    console.warn("CORS Security restriction: Run this file on a local HTTP server (e.g. VS Code Live Server) to allow getImageData access.");
  }
});

container.addEventListener('mouseleave', clearHighlight);

function clearHighlight() {
  currentActiveColor = null;
  container.classList.remove('has-active');
  colorPhoto.classList.remove('active');
  infoGradient.classList.remove('active');
  overlay.classList.remove('active');
}

// --- 4. GENERATE PIN STARS ---
(function(){
  const bg = document.getElementById('starsBg');
  if (!bg) return;
  for (let i = 0; i < 60; i++){
    const star = document.createElement('div');
    star.className = 'pin-star';
    star.style.top = Math.random() * 100 + '%';
    star.style.left = Math.random() * 100 + '%';
    star.style.width = (Math.random() * 2 + 1) + 'px';
    star.style.height = star.style.width;
    star.style.background = '#ffffff';
    star.style.animation = 'pin-flicker ' + (Math.random() * 3 + 2) + 's ease-in-out infinite';
    bg.appendChild(star);
  }
})();
</script>
