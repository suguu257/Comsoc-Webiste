<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reusable Stars Background</title>
<style>
  :root{
    --bg-black:#000000;
    --sq-blue:#2f5fe0;
    --sq-blue-2:#1b3fb8;
    --twinkle-blue:#8ecbff;
    --twinkle-blue-2:#5aa8f5;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    height:100%;
    background:var(--bg-black);
  }

  /* ============================================
     REUSABLE COMPONENT: .stars-bg
     Drop this div (plus the CSS below and the
     init script at the bottom) as the first child
     of any relatively-positioned section. Real page
     content goes after it with z-index:1+. No text
     lives in this layer -- pure animated background.
     ============================================ */

  .stars-bg{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:var(--bg-black);
    z-index:0;
  }

  /* ---------- base tiled star layers (depth + ambient density) ---------- */
  .stars-bg .layer{
    position:absolute;
    inset:-10%;
    background-repeat:repeat;
    will-change:transform, opacity;
  }

  .stars-bg .layer.tiny{
    background-image:
      radial-gradient(1px 1px at 5% 10%, #fff, transparent 100%),
      radial-gradient(1px 1px at 15% 45%, #fff, transparent 100%),
      radial-gradient(1px 1px at 25% 80%, #fff, transparent 100%),
      radial-gradient(1px 1px at 35% 25%, #fff, transparent 100%),
      radial-gradient(1px 1px at 45% 60%, #fff, transparent 100%),
      radial-gradient(1px 1px at 55% 15%, #fff, transparent 100%),
      radial-gradient(1px 1px at 65% 90%, #fff, transparent 100%),
      radial-gradient(1px 1px at 75% 35%, #fff, transparent 100%),
      radial-gradient(1px 1px at 85% 70%, #fff, transparent 100%),
      radial-gradient(1px 1px at 95% 20%, #fff, transparent 100%),
      radial-gradient(1px 1px at 10% 95%, #fff, transparent 100%),
      radial-gradient(1px 1px at 90% 50%, #fff, transparent 100%);
    background-size:220px 220px;
    animation:drift-wander-1 95s ease-in-out infinite, twinkle-flicker-a 3.1s ease-in-out infinite;
    opacity:.75;
  }

  .stars-bg .layer.small{
    background-image:
      radial-gradient(1.3px 1.3px at 8% 25%, #fff, transparent 100%),
      radial-gradient(1.3px 1.3px at 22% 60%, #fff, transparent 100%),
      radial-gradient(1.3px 1.3px at 38% 10%, #fff, transparent 100%),
      radial-gradient(1.3px 1.3px at 52% 75%, #fff, transparent 100%),
      radial-gradient(1.3px 1.3px at 66% 40%, #fff, transparent 100%),
      radial-gradient(1.3px 1.3px at 78% 85%, #fff, transparent 100%),
      radial-gradient(1.3px 1.3px at 88% 15%, #fff, transparent 100%),
      radial-gradient(1.3px 1.3px at 95% 55%, #fff, transparent 100%),
      radial-gradient(1.3px 1.3px at 15% 90%, #fff, transparent 100%);
    background-size:300px 300px;
    animation:drift-wander-2 78s ease-in-out infinite, twinkle-flicker-b 2.4s ease-in-out infinite;
    opacity:.8;
  }

  .stars-bg .layer.medium{
    background-image:
      radial-gradient(1.8px 1.8px at 12% 30%, #fff, transparent 100%),
      radial-gradient(1.8px 1.8px at 30% 70%, #fff, transparent 100%),
      radial-gradient(1.8px 1.8px at 50% 20%, #fff, transparent 100%),
      radial-gradient(1.8px 1.8px at 70% 55%, #fff, transparent 100%),
      radial-gradient(1.8px 1.8px at 88% 80%, #fff, transparent 100%),
      radial-gradient(1.8px 1.8px at 95% 35%, #fff, transparent 100%);
    background-size:420px 420px;
    animation:drift-wander-3 64s ease-in-out infinite, twinkle-flicker-c 1.9s ease-in-out infinite;
    opacity:.88;
  }

  .stars-bg .layer.large{
    background-image:
      radial-gradient(2.4px 2.4px at 18% 40%, #fff, transparent 100%),
      radial-gradient(2.6px 2.6px at 48% 22%, #fff, transparent 100%),
      radial-gradient(2.4px 2.4px at 72% 65%, #fff, transparent 100%),
      radial-gradient(2.8px 2.8px at 90% 15%, #fff, transparent 100%);
    background-size:560px 560px;
    animation:drift-wander-4 48s ease-in-out infinite, twinkle-flicker-d 1.5s ease-in-out infinite;
    opacity:.95;
    filter:drop-shadow(0 0 3px rgba(255,255,255,0.7));
  }

  /* non-linear, multi-waypoint drift so layers don't feel like they're on rails */
  @keyframes drift-wander-1{
    0%{ transform:translate3d(0,0,0); }
    22%{ transform:translate3d(-60px,40px,0); }
    50%{ transform:translate3d(-150px,-90px,0); }
    74%{ transform:translate3d(-90px,-160px,0); }
    100%{ transform:translate3d(0,0,0); }
  }
  @keyframes drift-wander-2{
    0%{ transform:translate3d(0,0,0); }
    30%{ transform:translate3d(90px,-50px,0); }
    55%{ transform:translate3d(180px,30px,0); }
    80%{ transform:translate3d(70px,140px,0); }
    100%{ transform:translate3d(0,0,0); }
  }
  @keyframes drift-wander-3{
    0%{ transform:translate3d(0,0,0); }
    28%{ transform:translate3d(-110px,-60px,0); }
    60%{ transform:translate3d(60px,-130px,0); }
    82%{ transform:translate3d(120px,50px,0); }
    100%{ transform:translate3d(0,0,0); }
  }
  @keyframes drift-wander-4{
    0%{ transform:translate3d(0,0,0); }
    35%{ transform:translate3d(80px,90px,0); }
    65%{ transform:translate3d(-70px,120px,0); }
    88%{ transform:translate3d(-130px,20px,0); }
    100%{ transform:translate3d(0,0,0); }
  }

  /* irregular flicker curves (asymmetric stops = less "breathing", more alive) */
  @keyframes twinkle-flicker-a{ 0%{opacity:.3;} 18%{opacity:.9;} 34%{opacity:.4;} 58%{opacity:1;} 77%{opacity:.35;} 100%{opacity:.3;} }
  @keyframes twinkle-flicker-b{ 0%{opacity:.25;} 15%{opacity:.8;} 40%{opacity:.3;} 62%{opacity:1;} 85%{opacity:.4;} 100%{opacity:.25;} }
  @keyframes twinkle-flicker-c{ 0%{opacity:.35;} 20%{opacity:1;} 45%{opacity:.3;} 68%{opacity:.9;} 90%{opacity:.4;} 100%{opacity:.35;} }
  @keyframes twinkle-flicker-d{ 0%{opacity:.4;} 12%{opacity:1;} 38%{opacity:.35;} 55%{opacity:.95;} 80%{opacity:.3;} 100%{opacity:.4;} }

  /* ---------- foreground pin stars: injected by JS with randomized position/size/timing/path ---------- */
  .stars-bg .pin-star{
    position:absolute;
    border-radius:50%;
    will-change:transform, opacity;
  }

  /* generic irregular flicker + wander used by every JS-generated star;
     each instance randomizes duration/delay and --dx/--dy via inline style,
     so no two stars move or blink in sync */
  @keyframes pin-flicker{
    0%{ opacity:.1; transform:translate3d(0,0,0) scale(.6); }
    14%{ opacity:1; transform:translate3d(calc(var(--dx,6px) * .3), calc(var(--dy,6px) * -.4), 0) scale(1.3); }
    29%{ opacity:.2; transform:translate3d(calc(var(--dx,6px) * .1), calc(var(--dy,6px) * .2), 0) scale(.7); }
    47%{ opacity:.95; transform:translate3d(calc(var(--dx,6px) * .6), calc(var(--dy,6px) * .5), 0) scale(1.2); }
    63%{ opacity:.15; transform:translate3d(calc(var(--dx,6px) * .4), calc(var(--dy,6px) * -.2), 0) scale(.8); }
    81%{ opacity:1; transform:translate3d(calc(var(--dx,6px) * .8), calc(var(--dy,6px) * .7), 0) scale(1.4); }
    100%{ opacity:.1; transform:translate3d(0,0,0) scale(.6); }
  }

  /* four-pointed sparkle bursts (white + blue, echoing the reference art) */
  .stars-bg .sparkle{
    position:absolute;
    animation:sparkle-pulse 4.2s ease-in-out infinite;
    will-change:transform, opacity;
  }
  .stars-bg .sparkle svg{ display:block; }
  @keyframes sparkle-pulse{
    0%{ opacity:0; transform:scale(.4) rotate(-8deg); }
    35%{ opacity:1; transform:scale(1.05) rotate(14deg); }
    55%{ opacity:.5; transform:scale(.8) rotate(6deg); }
    100%{ opacity:0; transform:scale(.4) rotate(-8deg); }
  }

  /* soft blue glow ring, like the small circle accent in the reference */
  .stars-bg .glow-ring{
    position:absolute;
    border-radius:50%;
    border:3px solid var(--twinkle-blue);
    box-shadow:0 0 14px 2px rgba(94,168,245,0.7), inset 0 0 8px rgba(142,203,255,0.6);
    animation:ring-pulse 3.6s ease-in-out infinite;
  }
  @keyframes ring-pulse{
    0%,100%{ opacity:.5; transform:scale(.92); }
    50%{ opacity:1; transform:scale(1.08); }
  }

  /* ---------- floating squares (blue solid + white/blue blurred) ---------- */
  .stars-bg .sq{
    position:absolute;
    will-change:transform;
  }
  .stars-bg .sq.blur{ filter:blur(14px); }
  .stars-bg .sq.solid-blue{
    background:linear-gradient(145deg, var(--sq-blue), var(--sq-blue-2));
    box-shadow:0 0 30px 4px rgba(47,95,224,0.55);
    border-radius:4px;
  }
  .stars-bg .sq.solid-white{
    background:rgba(255,255,255,0.95);
    border-radius:3px;
  }

  /* each square gets its own randomized wander keyframe assigned via JS
     (float-wander-1..6), so squares drift in irregular little loops
     instead of a uniform up/down bob */
  @keyframes float-wander-1{
    0%{ transform:translate(0,0) rotate(var(--rot,0deg)); }
    30%{ transform:translate(10px,-16px) rotate(var(--rot,0deg)); }
    58%{ transform:translate(-8px,-26px) rotate(var(--rot,0deg)); }
    82%{ transform:translate(-14px,-6px) rotate(var(--rot,0deg)); }
    100%{ transform:translate(0,0) rotate(var(--rot,0deg)); }
  }
  @keyframes float-wander-2{
    0%{ transform:translate(0,0) rotate(var(--rot,0deg)); }
    25%{ transform:translate(-14px,-10px) rotate(var(--rot,0deg)); }
    55%{ transform:translate(6px,-22px) rotate(var(--rot,0deg)); }
    85%{ transform:translate(16px,-4px) rotate(var(--rot,0deg)); }
    100%{ transform:translate(0,0) rotate(var(--rot,0deg)); }
  }
  @keyframes float-wander-3{
    0%{ transform:translate(0,0) rotate(var(--rot,0deg)); }
    33%{ transform:translate(12px,14px) rotate(var(--rot,0deg)); }
    60%{ transform:translate(-10px,20px) rotate(var(--rot,0deg)); }
    88%{ transform:translate(-16px,4px) rotate(var(--rot,0deg)); }
    100%{ transform:translate(0,0) rotate(var(--rot,0deg)); }
  }
  @keyframes float-wander-4{
    0%{ transform:translate(0,0) rotate(var(--rot,0deg)); }
    20%{ transform:translate(-8px,12px) rotate(var(--rot,0deg)); }
    50%{ transform:translate(-18px,-8px) rotate(var(--rot,0deg)); }
    78%{ transform:translate(4px,-18px) rotate(var(--rot,0deg)); }
    100%{ transform:translate(0,0) rotate(var(--rot,0deg)); }
  }

  /* checkerboard cluster */
  .stars-bg .checker{
    position:absolute;
    display:grid;
    grid-template-columns:repeat(3, 18px);
    grid-template-rows:repeat(3, 18px);
  }
  .stars-bg .checker div{ width:18px; height:18px; }
  .stars-bg .checker div:nth-child(odd){ background:rgba(255,255,255,0.9); }
  .stars-bg .checker div:nth-child(even){ background:transparent; }

  /* thin vertical stripe clusters */
  .stars-bg .stripes{
    position:absolute;
    display:flex;
    gap:4px;
  }
  .stars-bg .stripes span{ width:4px; height:70px; border-radius:2px; }
  .stars-bg .stripes.set-a span:nth-child(1){ background:#1b3fb8; }
  .stars-bg .stripes.set-a span:nth-child(2){ background:#2f5fe0; }
  .stars-bg .stripes.set-a span:nth-child(3){ background:#6fa8ec; }
  .stars-bg .stripes.set-a span:nth-child(4){ background:#a8d4ff; }
  .stars-bg .stripes.set-a span:nth-child(5){ background:#e8f4ff; }
  .stars-bg .stripes.set-a span:nth-child(6){ background:#ffffff; }
</style>
</head>
<body>

<!-- ===== reusable background block: copy this div + its CSS + the init script ===== -->
<div class="stars-bg" id="starsBg">

  <!-- base tiled star layers (ambient depth) -->
  <div class="layer tiny"></div>
  <div class="layer small"></div>
  <div class="layer medium"></div>
  <div class="layer large"></div>

  <!-- foreground pin-stars + sparkles are injected here by JS at runtime -->

  <!-- blue glow ring accent, echoing the reference art -->
  <div class="glow-ring" style="top:31%; left:44%; width:22px; height:22px;"></div>

  <!-- floating squares: white blurred cluster, top right (diagonal stack) -->
  <div class="sq solid-white blur" style="top:6%; left:82%; width:60px; height:60px; --rot:0deg; animation:float-wander-1 12s ease-in-out infinite;"></div>
  <div class="sq solid-white blur" style="top:12%; left:76%; width:44px; height:44px; --rot:0deg; animation:float-wander-3 9.5s ease-in-out infinite; animation-delay:.6s;"></div>
  <div class="sq solid-white blur" style="top:16%; left:86%; width:36px; height:36px; --rot:0deg; animation:float-wander-2 10.5s ease-in-out infinite; animation-delay:1.3s;"></div>

  <!-- rotated white diamond, top left -->
  <div class="sq solid-white blur" style="top:9%; left:24%; width:56px; height:56px; --rot:28deg; transform:rotate(28deg); animation:float-wander-4 13s ease-in-out infinite; animation-delay:.3s;"></div>

  <!-- scattered blurred white squares, mid/lower field -->
  <div class="sq solid-white blur" style="top:60%; left:70%; width:50px; height:50px; animation:float-wander-2 11s ease-in-out infinite; animation-delay:.9s;"></div>
  <div class="sq solid-white blur" style="top:65%; left:60%; width:34px; height:34px; animation:float-wander-1 8.5s ease-in-out infinite; animation-delay:1.7s;"></div>
  <div class="sq solid-white blur" style="top:82%; left:42%; width:36px; height:36px; animation:float-wander-3 10s ease-in-out infinite; animation-delay:.4s;"></div>
  <div class="sq solid-white blur" style="top:83%; left:9%; width:38px; height:38px; animation:float-wander-4 9s ease-in-out infinite; animation-delay:1.5s;"></div>

  <!-- solid blue squares, lower field -->
  <div class="sq solid-blue" style="top:75%; left:48%; width:34px; height:34px; animation:float-wander-2 8s ease-in-out infinite; animation-delay:.2s;"></div>
  <div class="sq solid-blue" style="top:78%; left:14%; width:60px; height:44px; animation:float-wander-1 10.5s ease-in-out infinite; animation-delay:1.1s;"></div>

  <!-- checkerboard cluster, bottom right -->
  <div class="checker" style="top:80%; left:83%; animation:float-wander-3 12.5s ease-in-out infinite; animation-delay:.8s;">
    <div></div><div></div><div></div>
    <div></div><div></div><div></div>
    <div></div><div></div><div></div>
  </div>

  <!-- vertical stripe accents -->
  <div class="stripes set-a" style="top:73%; left:3%; animation:float-wander-4 11.5s ease-in-out infinite; animation-delay:.2s;">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
  <div class="stripes set-a" style="top:92%; left:44%; transform:scale(.5); animation:float-wander-2 9.5s ease-in-out infinite; animation-delay:1.4s;">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

</div>

<script>
(function(){
  var container = document.getElementById('starsBg');
  var wanderKeys = ['float-wander-1','float-wander-2','float-wander-3','float-wander-4'];

  // ---- randomized foreground pin-stars (white + blue), each with its own
  // duration, delay, size and wander distance so nothing blinks or drifts
  // in sync -- this is what makes the field feel alive rather than looping ----
  var STAR_COUNT = 90;
  for (var i = 0; i < STAR_COUNT; i++){
    var star = document.createElement('div');
    star.className = 'pin-star';

    var top = Math.random() * 100;
    var left = Math.random() * 100;
    var size = (Math.random() * 2.2 + 1).toFixed(2); // 1 - 3.2px
    var duration = (Math.random() * 3 + 1.8).toFixed(2); // 1.8 - 4.8s
    var delay = (Math.random() * 5).toFixed(2);
    var dx = (Math.random() * 14 - 7).toFixed(1) + 'px';
    var dy = (Math.random() * 14 - 7).toFixed(1) + 'px';

    // ~1 in 4 stars gets a blue tint like the accents in the reference art
    var isBlue = Math.random() < 0.25;
    var color = isBlue ? 'var(--twinkle-blue)' : '#ffffff';
    var glow = isBlue
      ? '0 0 7px 2px rgba(94,168,245,0.85)'
      : '0 0 6px 1px rgba(255,255,255,0.9)';

    star.style.top = top + '%';
    star.style.left = left + '%';
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.background = color;
    star.style.boxShadow = glow;
    star.style.setProperty('--dx', dx);
    star.style.setProperty('--dy', dy);
    star.style.animation = 'pin-flicker ' + duration + 's ease-in-out infinite';
    star.style.animationDelay = delay + 's';

    container.appendChild(star);
  }

  // ---- a handful of larger sparkle bursts (white + blue), positioned
  // loosely around where the reference art places them ----
  var sparkleSpots = [
    { top: 30, left: 88, size: 34, color: '#8ecbff', delay: 0 },
    { top: 33, left: 91, size: 18, color: '#ffffff', delay: 1.4 },
    { top: 8,  left: 60, size: 16, color: '#ffffff', delay: 2.1 },
    { top: 46, left: 6,  size: 14, color: '#8ecbff', delay: 0.7 },
    { top: 68, left: 92, size: 15, color: '#ffffff', delay: 2.6 }
  ];
  sparkleSpots.forEach(function(s, idx){
    var wrap = document.createElement('div');
    wrap.className = 'sparkle';
    wrap.style.top = s.top + '%';
    wrap.style.left = s.left + '%';
    wrap.style.animationDuration = (3.5 + Math.random() * 2).toFixed(2) + 's';
    wrap.style.animationDelay = s.delay + 's';
    wrap.innerHTML = '<svg width="' + s.size + '" height="' + s.size + '" viewBox="0 0 24 24">' +
      '<path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" fill="' + s.color + '"/></svg>';
    container.appendChild(wrap);
  });
})();
</script>

</body>
</html>
